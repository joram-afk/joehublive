<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
    form { max-width: 420px; margin-bottom: 16px; }
    label { display:block; margin-bottom:8px; }
  </style>
</head>
<body>
  <h1>Login</h1>

  <!-- existing username/password form (keep if you already have one) -->
  <form id="loginForm">
    <label>Email: <input type="email" id="email" name="email" required></label>
    <label>Password: <input type="password" id="password" name="password" required></label>
    <button type="submit">Login</button>
  </form>

  <hr>

  <!-- Google sign-in button placeholder -->
  <div id="gSignInDiv"></div>

  <script>
    // Replace with your Google OAuth Client ID. See AUTHENTICATION.md for instructions.
    const GOOGLE_CLIENT_ID = '486225891520-i6brd43odhrskjadi52gd0glpujse56u.apps.googleusercontent.com';

    function onGoogleLoaded() {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById('gSignInDiv'),
        { theme: 'outline', size: 'large' }
      );
      // optional: show One Tap prompt
      // google.accounts.id.prompt();
    }

    function handleCredentialResponse(response) {
      // auth.js exposes handleGoogleCredential to reuse logic
      window.handleGoogleCredential(response, { after: 'login' });
    }

    // Wait until the client library is loaded, then init
    window.addEventListener('load', function () {
      if (window.google && google.accounts && google.accounts.id) {
        onGoogleLoaded();
      } else {
        // if script hasn't loaded yet, poll a few times
        const intv = setInterval(() => {
          if (window.google && google.accounts && google.accounts.id) {
            clearInterval(intv);
            onGoogleLoaded();
          }
        }, 100);
      }
    });

    // Example: existing login form handler (client-only). Customize to integrate with your backend.
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pw = document.getElementById('password').value;
      // TODO: send to your server for authentication or handle client-only flow
      alert('Local login submitted for ' + email + '. Implement server-side auth.');
    });
  </script>
</body>
</html>
