<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=login.html">
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { text-align:center; }
    a { color: #0366d6; }
  </style>
</head>
<body>
  <div class="box">
    <p>If you are not redirected automatically, <a href="login.html">click here to go to Login</a>.</p>
    <script>
      // Immediate JS redirect as fallback for clients that ignore meta refresh
      try { window.location.replace('login.html'); } catch (e) { /* ignore */ }
    </script>
  </div>
</body>
</html>
