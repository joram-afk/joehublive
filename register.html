<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/assets/js/auth.js" defer></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; }
    form { max-width: 520px; margin-bottom: 16px; }
    label { display:block; margin-bottom:8px; }
  </style>
</head>
<body>
  <h1>Register</h1>

  <form id="registerForm">
    <label>Full name: <input type="text" id="fullname" name="fullname" required></label>
    <label>Email: <input type="email" id="regEmail" name="email" required></label>
    <label>Password: <input type="password" id="regPassword" name="password" required></label>
    <button type="submit">Register</button>
  </form>

  <hr>

  <!-- Google sign-in button for registration -->
  <div id="gSignInDiv"></div>

  <script>
    const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID';

    function onGoogleLoaded() {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById('gSignInDiv'),
        { theme: 'outline', size: 'large' }
      );
    }

    function handleCredentialResponse(response) {
      // auth.js handles token: will prefill register fields if present
      window.handleGoogleCredential(response, { after: 'register' });
    }

    window.addEventListener('load', function () {
      if (window.google && google.accounts && google.accounts.id) {
        onGoogleLoaded();
      } else {
        const intv = setInterval(() => {
          if (window.google && google.accounts && google.accounts.id) {
            clearInterval(intv);
            onGoogleLoaded();
          }
        }, 100);
      }
    });

    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // Example client-side register handling. Replace with server-side registration for production.
      const name = document.getElementById('fullname').value;
      const email = document.getElementById('regEmail').value;
      alert('Register submitted for ' + name + ' (' + email + '). Implement server-side registration.');
    });
  </script>
</body>
</html>
